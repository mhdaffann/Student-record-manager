<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Record Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="header-content">
            <h1>🎓 Student Record Manager</h1>
            <p>Manage, search and analyze student performance</p>
        </div>
    </header>

    <main class="container">

        <!-- Statistics -->
        <section class="stats">
            <div class="stat-card">
                <span>👥</span>
                <h3>Total Students</h3>
                <p id="total-students">0</p>
            </div>

            <div class="stat-card">
                <span>📊</span>
                <h3>Average Marks</h3>
                <p id="average-marks">0</p>
            </div>

            <div class="stat-card">
                <span>🏆</span>
                <h3>Topper</h3>
                <p id="topper">-</p>
            </div>
        </section>

        <!-- Search and Filters -->
        <section class="controls">

            <input
                type="text"
                id="search"
                placeholder="Search student by name..."
            >

            <select id="course-filter">
                <option value="all">All Courses</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Mathematics">Mathematics</option>
                <option value="Physics">Physics</option>
                <option value="Commerce">Commerce</option>
            </select>

            <select id="marks-filter">
                <option value="all">All Marks</option>
                <option value="90">90 and above</option>
                <option value="80">80 and above</option>
                <option value="70">70 and above</option>
            </select>

            <select id="sort">
                <option value="default">Sort By</option>
                <option value="name-asc">Name (A-Z)</option>
                <option value="name-desc">Name (Z-A)</option>
                <option value="marks-high">Marks (High-Low)</option>
                <option value="marks-low">Marks (Low-High)</option>
            </select>

        </section>

        <!-- Student Records -->
        <section class="records">
            <div class="section-heading">
                <h2>Student Records</h2>
                <span id="result-count">0 results</span>
            </div>

            <div id="student-list" class="student-grid"></div>

            <p id="no-results" class="no-results">
                No students found.
            </p>
        </section>

    </main>

    <footer>
        <p>Student Record Manager | LF 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
  </html>
